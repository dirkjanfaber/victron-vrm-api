components:
  schemas:
    Attribute:
      type: object
      properties:
        idDataAttribute: 
          type: number
          example: 1215
        code: 
          type: string
          example: "bPOR"
        description:
          type: string
          example: "Off reason"
        targetTable:
          type: string
          example: "logData"
        idDeviceType:
          type: int
          example: 33
        formatWithUnit:
          type: string
          example: "%s"
        dataType:
          type: string
          example: "enum"
        enumValues:
          type: string
          example: []

    FloatAlarm:
      type: object
      properties:
        AlarmEnabled:
          type: number
          example: 1
        NotifyAfterSeconds:
          type: number
          example: 60
        highAlarm:
          type: number
          example: 2.0
        highAlarmHysteresis:
          type: number
          example: 2.0
        idDataAttribute:
          type: number
          example: 630
        instance:
          type: number
          example: 0
        lowAlarm:
          type: number
          example: 0.0
        lowAlarmHysteresis:
          type: number
          example: 0.2
        idDataAttributeLimit:
          type: integer
          example: 76571

    User:
      type: object
      properties:
        idUser:
          type: integer
          example: 174862
        idSite:
          type: integer
          example: 32223
        accessLevel:
          type: integer
          example: 0
        receivesAlarmNotifications:
          type: integer
          example: 0
        receivesReports:
          type: integer
          example: 0
        email:
          type: string
          example: user@email.com
        name:
          type: string
          example: John Doe
        avatar_url:
          type: string
          example: https://www.gravatar.com/avatar/09821a2342asdf098234asdf8jhg3459?s=80&d=404&r=g
        muted:
          type: boolean
          example: false

    Device:
      type: object
      properties:
        idSite:
          type: integer
          example: 32223
        instance:
          type: integer
          example: 0
        lastConnection:
          type: integer
          example: 1682696559
        secondsAgo:
          type: integer
          example: 27
        isValid:
          type: integer
          example: 1
        idDeviceType:
          type: integer
          example: 0
        deviceName:
          type: string
          example: Gateway
        productIdAsReceived:
          type: integer
          example: 2
        productName:
          type: string
          example: Color Control GX
        customProductName:
          type: string
          example: Color Control GX
        firmwareVersion:
          type: string
          example: v3.00~29
        connection:
          type: string
          example: 
        customName:
          type: string
          example: null
        identifier:
          type: string
          example: 000000a0a000
