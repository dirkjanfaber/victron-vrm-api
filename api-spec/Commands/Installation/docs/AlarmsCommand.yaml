delete:
  summary: Delete Alarm 
  description: Deletes an alarm already linked to an installation.
  tags:
    - Installations
  parameters:
    - $ref: '../../../docs/components.yaml#/components/parameters/authorization'
    - name: idSite
      description: Installation ID
      in: path
      required: true
      schema:
        type: number
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            idDataAttribute:
              type: number
              required: true
              example: 630
            instance:
              type: number
              required: true
              example: 0
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                description: True if the request was successful.
                type: boolean
              idSite:
                description: installation ID
                type: integer
    '4xx':
      description: Could not delete alarm 
      content:
        application/json:
          schema:
            $ref: '../../../docs/components.yaml#/components/schemas/generalError'


