get:
  summary: Dynamic ESS configuration
  description:
  tags:
    - Installations
  parameters:
    - name: id
      in: path
      description: The ID of the installation
      required: true
      schema:
        type: integer
    - $ref: '../../../docs/components.yaml#/components/parameters/authorization'
  responses:
    '200':
      description: Successfully updated the Dynamic ESS configuration for this installation.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                description: True if the request was successful.
                type: boolean
              idSite:
                description: The ID of the updated installation.
                type: integer
              data:
                description: Contains the updated configuration for the installation.
                $ref: '#/components/schemas/DynamicEssConfiguration'
              vehicle_data:
                description: |
                  Map of VIN to per-vehicle DESS data, keyed by Vehicle Identification Number.
                  Each entry exposes both `defaults` (the user's stored values, source of truth
                  for the Settings page form when editable) and `effective` (the values currently
                  in force, taking session overrides and evts into account).
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/VehicleDataEntry'
    '403':
      description: User is not authorized to access or modify this installation.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                description: False as the request was unsuccessful.
                type: boolean
              errors:
                description: User is not authorized for this operation.
                type: string
              error_code:
                description: The error code, if applicable.
                type:
                  - 'null'
                  - string
            required:
              - success
              - errors
              - error_code
    '404':
      description: Installation not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                description: True if the request was successful.
                type: boolean
              errors:
                description: Installation with the given ID was not found.
                type: string
              error_code:
                description: The error code, if applicable.
                type:
                  - 'null'
                  - string
            required:
              - success
              - errors
              - error_code

