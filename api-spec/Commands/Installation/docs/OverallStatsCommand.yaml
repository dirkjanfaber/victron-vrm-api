components:
  operations:
    get:
      operationId: installations/idSite/overallstats
      summary: Overall installation stats
      tags:
        - Installations
      description: Retrieves installation stats grouped by the last year, month, week and day. If the datatype is set to custom, one or more attributes can be provided using the attributeCodes[] parameter.
      parameters:
        - $ref: '../../../docs/components.yaml#/components/parameters/authorization'
        - name: idSite
          description: Installation id
          in: path
          required: true
          schema:
            type: string
        - name: type
          description: |
            Type of data to fetch, defaults to live_feed. If set to custom, the attributeCodes[] parameter must be provided.

            * `venus` - The full set of power and energy series shown on the VRM dashboard: grid, AC input/output, genset, inverter power, battery state, DC power, consumption, solar yield, AC loads, temperature, EV charger, AC meter, PV inverter, heat pump and grid meter.
            * `live_feed` - (default) Live overview series: total consumption, total solar yield, battery state of charge and voltage, DC power, output current, energy to/from grid and total genset energy.
            * `consumption` - Consumed energy split by source: from PV, battery, genset and grid, plus EV charger, heat pump and AC system energy.
            * `solar_yield` - Solar production split by destination: total solar yield and PV to consumers, battery and grid.
            * `kwh` - Energy (kWh) counters.
            * `generator` - Genset energy: genset to consumers and genset to battery.
            * `generator-runtime` - Accumulated generator run-time.
            * `custom` - Series for the attributes given via the attributeCodes[] parameter.
          in: query
          required: false
          schema:
            type: string
            enum:
              - venus
              - live_feed
              - consumption
              - solar_yield
              - kwh
              - generator
              - generator-runtime
              - custom
        - name: attributeCodes[]
          description: Attribute codes for which to retrieve series, repeated for each attribute. Required at least once if datatype is set to custom.
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved overall statistics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    description: True if the request was successful.
                    type: boolean
                  records:
                    description: Overall statistics grouped by timeframe.
                    type: object
                    properties:
                      year:
                        $ref: '#/components/schemas/timeframe'
                      month:
                        $ref: '#/components/schemas/timeframe'
                      week:
                        $ref: '#/components/schemas/timeframe'
                      today:
                        $ref: '#/components/schemas/timeframe'
                required:
                  - success
                  - records
        '4xx':
          description: Request unsuccessful.
          content:
            application/json:
              schema:
                $ref: '../../../docs/components.yaml#/components/schemas/generalError'
  schemas:
    timeframe:
      description: Totals and percentages.
      type: object
      properties:
        totals:
          $ref: 'StatsCommand.yaml#/components/schemas/totalsList'
        percentages:
          description: Percentage for each data attribute.
          type: object
          additionalProperties:
            type: integer
      required:
        - totals
        - percentages


