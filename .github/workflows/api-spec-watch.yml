name: VRM API spec watch

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24.x

    - name: Mirror published spec
      run: node scripts/sync-api-spec.js

    # Opens a PR on first change and force-updates it on later runs, so the
    # PR diff always shows upstream changes relative to main
    - name: Open or update pull request
      uses: peter-evans/create-pull-request@v8
      with:
        branch: automated/api-spec-update
        add-paths: api-spec
        commit-message: 'chore(api-spec): sync published VRM API spec'
        title: 'chore(api-spec): VRM API documentation changed'
        body: |
          The published spec at https://vrm-api-docs.victronenergy.com/ differs from the snapshot in `api-spec/`.

          Review the diff for changes affecting the node, then merge to acknowledge.
        labels: api-spec
